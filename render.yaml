# ANIMAX · Deploy en Render (gratuito)
services:
  - type: web
    name: animax-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
    # Render inyecta PORT automáticamente
